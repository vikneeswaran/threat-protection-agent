name: Build Security Client Agents

on:
  push:
    branches:
      - main
    paths:
      - 'agent-tray/**'
      - 'public/tray/**'
      - '.github/workflows/build-agents.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    name: Build macOS Agent
    runs-on: macos-latest
    env:
      AGENT_VERSION: '1.0.24'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller
      - run: |
          cd agent-tray
          python3 -m PyInstaller KuaminiSecurityClient-mac.spec
      - run: |
          cd agent-tray
          bash build/pkgbuild-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent
          path: agent-tray/build/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg
          retention-days: 30

  build-windows:
    name: Build Windows Agent
    runs-on: windows-latest
    env:
      AGENT_VERSION: '1.0.24'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - run: |
          cd agent-tray
          python build/build-windows-msi.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip
          retention-days: 30

  build-linux:
    name: Build Linux Agent
    runs-on: ubuntu-latest
    env:
      AGENT_VERSION: '1.0.24'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - run: |
          cd agent-tray
          rm -rf dist/KuaminiSecurityClient
          pyinstaller main.py --onedir --name=KuaminiSecurityClient -y
      - run: |
          cd agent-tray
          tar -czf dist/KuaminiSecurityClient-${AGENT_VERSION}-linux.tar.gz -C dist KuaminiSecurityClient
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: agent-tray/dist/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz
          retention-days: 30

  deploy:
    name: Deploy Agents
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    ### if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p public/tray
          cp macos-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg public/tray/ || echo "⚠ macOS agent not found"
          cp windows-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip public/tray/ || echo "⚠ Windows agent not found"
          cp linux-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz public/tray/ || echo "⚠ Linux agent not found"
          echo "Deployed agents:"
          ls -lh public/tray/
      - run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/tray/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update agents from latest codebase"
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg
            public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip
            public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
