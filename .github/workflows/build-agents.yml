name: Build Security Client Agents

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  AGENT_VERSION: 1.0.32

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]

          filepath = Path("agent-tray/version_info.txt")
          content = filepath.read_text(encoding="utf-8")
          content = (
              content.replace("{MAJOR}", major)
                     .replace("{MINOR}", minor)
                     .replace("{PATCH}", patch)
                     .replace("{FULL_VERSION}", version)
          )
          filepath.write_text(content, encoding="utf-8")
          print(f"Successfully generated macOS metadata for v{version}")

      - name: Build macOS package
        run: |
          cd agent-tray
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller
          python3 -m PyInstaller KuaminiSecurityClient-mac.spec
          AGENT_VERSION="${AGENT_VERSION}" bash build/pkgbuild-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent
          path: agent-tray/build/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]

          filepath = Path("agent-tray/version_info.txt")
          content = filepath.read_text(encoding="utf-8")
          content = (
              content.replace("{MAJOR}", major)
                     .replace("{MINOR}", minor)
                     .replace("{PATCH}", patch)
                     .replace("{FULL_VERSION}", version)
          )
          filepath.write_text(content, encoding="utf-8")
          print(f"Successfully generated Windows metadata for v{version}")

      - name: Build Windows MSI
        shell: pwsh
        run: |
          Set-Location agent-tray
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          $env:VERSION = $env:AGENT_VERSION
          python build/build-windows-msi.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          from pathlib import Path

          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]

          filepath = Path("agent-tray/version_info.txt")
          content = filepath.read_text(encoding="utf-8")
          content = (
              content.replace("{MAJOR}", major)
                     .replace("{MINOR}", minor)
                     .replace("{PATCH}", patch)
                     .replace("{FULL_VERSION}", version)
          )
          filepath.write_text(content, encoding="utf-8")
          print(f"Successfully generated Linux metadata for v{version}")

      - name: Build Linux package
        run: |
          cd agent-tray
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          rm -rf dist/KuaminiSecurityClient
          pyinstaller main.py --onedir --name=KuaminiSecurityClient -y
          tar -czf dist/KuaminiSecurityClient-${AGENT_VERSION}-linux.tar.gz -C dist KuaminiSecurityClient

      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: agent-tray/dist/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz

  deploy:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prevent overwriting existing release assets
        run: |
          if ls public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}* 1> /dev/null 2>&1; then
            echo "❌ Version ${{ env.AGENT_VERSION }} already exists in public/tray. Aborting deploy."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish artifacts into public/tray
        run: |
          mkdir -p public/tray
          cp artifacts/macos-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg public/tray/ || echo "⚠ macOS agent not found"
          cp artifacts/windows-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip public/tray/ || echo "⚠ Windows agent not found"
          cp artifacts/linux-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz public/tray/ || echo "⚠ Linux agent not found"
          ls -lh public/tray/

      - name: Commit published artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/tray/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update agents v${{ env.AGENT_VERSION }}"
            git pull --rebase origin main
            git push origin main
          fi
