name: Build Security Client Agents

on:
  workflow_dispatch:   # Only manual trigger

permissions:
  contents: write
  actions: read

jobs:
  version-setup:
    runs-on: ubuntu-latest
    outputs:
      agent_version: ${{ steps.version.outputs.agent_version }}
    steps:
      - name: Determine agent version
        id: version
        run: echo "agent_version=1.0.30" >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: macos-latest
    needs: version-setup
    env:
      AGENT_VERSION: ${{ needs.version-setup.outputs.agent_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]
          filepath = "agent-tray/version_info.txt"
          with open(filepath, "r") as f:
              content = f.read()
          content = content.replace("{MAJOR}", major).replace("{MINOR}", minor).replace("{PATCH}", patch).replace("{FULL_VERSION}", version)
          with open(filepath, "w") as f:
              f.write(content)
          print(f"Successfully generated macOS metadata for v{version}")

      - run: |
          cd agent-tray
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller
          python3 -m PyInstaller KuaminiSecurityClient-mac.spec
          bash build/pkgbuild-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent
          path: agent-tray/build/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg

  build-windows:
    runs-on: windows-latest
    needs: version-setup
    env:
      AGENT_VERSION: ${{ needs.version-setup.outputs.agent_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]
          filepath = "agent-tray/version_info.txt"
          with open(filepath, "r") as f:
              content = f.read()
          content = content.replace("{MAJOR}", major).replace("{MINOR}", minor).replace("{PATCH}", patch).replace("{FULL_VERSION}", version)
          with open(filepath, "w") as f:
              f.write(content)
          print(f"Successfully generated Windows metadata for v{version}")

      - run: |
          cd agent-tray
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python build/build-windows-msi.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: version-setup
    env:
      AGENT_VERSION: ${{ needs.version-setup.outputs.agent_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Auto-generate version_info.txt metadata
        shell: python
        run: |
          import os
          version = os.environ["AGENT_VERSION"]
          major, minor, patch = version.split(".")[:3]
          filepath = "agent-tray/version_info.txt"
          with open(filepath, "r") as f:
              content = f.read()
          content = content.replace("{MAJOR}", major).replace("{MINOR}", minor).replace("{PATCH}", patch).replace("{FULL_VERSION}", version)
          with open(filepath, "w") as f:
              f.write(content)
          print(f"Successfully generated Linux metadata for v{version}")

      - run: |
          cd agent-tray
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          rm -rf dist/KuaminiSecurityClient
          pyinstaller main.py --onedir --name=KuaminiSecurityClient -y
          tar -czf dist/KuaminiSecurityClient-${AGENT_VERSION}-linux.tar.gz -C dist KuaminiSecurityClient
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: agent-tray/dist/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz

  deploy:
    needs: [version-setup, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      AGENT_VERSION: ${{ needs.version-setup.outputs.agent_version }}
    steps:
      - uses: actions/checkout@v5

      - run: |
          if ls public/tray/KuaminiSecurityClient-${{ env.AGENT_VERSION }}* 1> /dev/null 2>&1; then
            echo "❌ Version ${{ env.AGENT_VERSION }} already exists in public/tray. Aborting deploy."
            exit 1
          fi

      - uses: actions/download-artifact@v4

      - run: |
          mkdir -p public/tray
          cp macos-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}.pkg public/tray/ || echo "⚠ macOS agent not found"
          cp windows-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-windows.zip public/tray/ || echo "⚠ Windows agent not found"
          cp linux-agent/KuaminiSecurityClient-${{ env.AGENT_VERSION }}-linux.tar.gz public/tray/ || echo "⚠ Linux agent not found"
          ls -lh public/tray/

      - run: |
          git config --global user.email "github-actions[bot]@://github.com"
          git config --global user.name "github-actions[bot]"
          git add public/tray/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update agents v${{ env.AGENT_VERSION }}"
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
