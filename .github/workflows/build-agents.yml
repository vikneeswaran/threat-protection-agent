name: Build Security Client Agents

on:
  workflow_dispatch:   # Only manual trigger

permissions:
  contents: write
  actions: read

env:
  VERSION: '1.0.29'   # <<< Change this version number each run

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller
          python3 -m PyInstaller KuaminiSecurityClient-mac.spec
          bash build/pkgbuild-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent
          path: agent-tray/build/KuaminiSecurityClient-${{ env.VERSION }}.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python build/build-windows-msi.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: public/tray/KuaminiSecurityClient-${{ env.VERSION }}-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd agent-tray
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          rm -rf dist/KuaminiSecurityClient
          pyinstaller main.py --onedir --name=KuaminiSecurityClient -y
          tar -czf dist/KuaminiSecurityClient-${VERSION}-linux.tar.gz -C dist KuaminiSecurityClient
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent
          path: agent-tray/dist/KuaminiSecurityClient-${{ env.VERSION }}-linux.tar.gz

  deploy:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: |
          if ls public/tray/KuaminiSecurityClient-${{ env.VERSION }}* 1> /dev/null 2>&1; then
            echo "❌ Version ${{ env.VERSION }} already exists in public/tray. Aborting deploy."
            exit 1
          fi

      - uses: actions/download-artifact@v4

      - run: |
          mkdir -p public/tray
          cp macos-agent/KuaminiSecurityClient-${{ env.VERSION }}.pkg public/tray/ || echo "⚠ macOS agent not found"
          cp windows-agent/KuaminiSecurityClient-${{ env.VERSION }}-windows.zip public/tray/ || echo "⚠ Windows agent not found"
          cp linux-agent/KuaminiSecurityClient-${{ env.VERSION }}-linux.tar.gz public/tray/ || echo "⚠ Linux agent not found"
          ls -lh public/tray/

      - run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add public/tray/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update agents v${{ env.VERSION }}"
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
